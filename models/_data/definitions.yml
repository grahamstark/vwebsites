gainlose:
  title: Tables of Gainers and Losers
  summary: This panel shows how many Scottish people gain at least £1 per week as a result of your changes, how many lose at least £1, and how many are unaffected.
  full: In the left hand columns of these tables are counts of people living in households whose net income has increased or decreased by different amounts. On the RHS of the tables are columns showing - total population in each group; Average Change in £s pw; Percentage Change in net income; and The total transfer to or from this subgroup, in £m p.a. These tables, and the inequality and poverty measures in other panels use [Equivalised Before-Housing Costs Income](https://www.gov.uk/government/statistics/households-below-average-income-for-financial-years-ending-1995-to-2025/households-below-average-income-background-information-and-methodology-report-fye-2025).

deciles:
  title: Gains by Income Decile
  summary: This graph divides the population into the poorest 10%, the next poorest 10% and so on up to the richest 10%, and shows the average gains in £s pw for each group.
  full:

costs:
   title: Revenues, Caseloads and Costs
   summary: These are our estimates of the costs of your changes, in £s p.a.
   full: These are our estimates of the annual costs and caseloads for each benefit we model, and revenues and numbers paying each tax. Note that we are assuming that everybody pays their taxes and claims their benefits - we don't currently correct for non-takeup of benefits, tax avoidance, or lags in payment. We're showing a costs summary at the top of the popup, and a fuller table at the bottom.
   note: Our estimates are for taxes raised and spending on benefits in Scotland, including taxes and benefits reserved to the UK Government. So it *isn't* the actual budget of the current Scottish Government, which includes only the devolved parts.

sfc:
   title: SFC Income Tax Corrections
   summary: This table is our reproduction of a standard approach to estimating how changes to income tax rates and bands might not raise as much money as first appears because people might change their behaviour in response. There is a lot of uncertainty and controversy around this subject, so we're including this table for completeness rather than because we fully endorse it.
   full: The costings we show in this panel assume people pay all the taxes they appear to be liable for, and don't change their behaviour when taxes change. There is a [large, but contentious academic literature on this subject](https://eml.berkeley.edu/~saez/saez-slemrod-giertzJEL12.pdf){:target="_blank"}. The [Scottish Fiscal Commission](https://fiscalcommission.scot/) (SFC) published a [report](https://www.fiscalcommission.scot/publications/how-we-forecast-behavioural-responses-to-income-tax-policy-march-2018/){:target="_blank"} showing how estimates of Scottish Income Tax revenues can be adjusted to allow for behavioural changes using results suggested by a [study by HMRC](https://www.gov.uk/government/publications/estimating-scottish-taxpayer-behaviour-in-response-to-scottish-income-tax-changes-introduced-in-2018-to-2019/estimating-scottish-taxpayer-behaviour-in-response-to-scottish-income-tax-changes-introduced-in-2018-to-2019){:target="_blank"}. This table shows our reproduction of SFC's methods for your changes. We include this for completeness; it doesn't mean that we fully endorse SFC's methodology or [the polemic that currently surrounds it](https://www.futureeconomy.scot/posts/589-a-response-to-dan-neidle-tax-doesn-t-always-explain-everything){:target="_blank"}.
   note: Please refer to the SFC study, particularly [the workbook](https://fiscalcommission.scot/wp-content/uploads/2019/11/How-we-forecast-behavioural-responses-to-income-tax-policy-March-2018-Calculation-workbook.xlsx){:target="_blank"} for more detail.

taxable_graph:
    title: Taxable Income and Tax Rates
    summary: This graph charts Scottish Taxable Income. The bars show how many taxpayers have a certain amount of taxable income, in £10 bands. The line is the marginal income tax rates applying at each band.
    full: The taxable income bars will change if you change the tax-free allowance, but otherwise we're not assuming any behavioural changes as tax rates and bands change - see the SFC table below for more on that.
    note: We're graphing the income taxed in Scotland only here - chiefly wages, self-employment income, pension income and income from rents; savings income and dividends are taxed by the UK Government and so aren't included here.

metrs:
    title: Incentives To Work - Marginal Effective Tax Rates (METRs)
    summary: The Marginal Effective Tax Rate (METR) is the percentage of the next £1 you earn that is taken away in direct taxes and reduced income-related benefits. A METR of 0 means you keep all of the next £1, while 100% means it's all taken away.
    full: The Marginal Effective Tax Rate (METR) is the percentage of the next £1 you earn that is taken away in direct taxes and reduced income-related benefits. A METR of 0 means you keep all of the next £1, while 100% means it's all taken away. If you pay income tax at 21%, and no other tax, then your METR is 21%. However, many people pay both income tax and National Insurance, and many of those will also be on income-related benefits such as Universal Credit - the METRs for those people will be a combination of all the tax rates and the benefit withdrawal rates, and this can be very high, sometimes over 100%.
    note: We calculate METRs here only for the working-age population (16-67), including students and the sick and disabled. For people who are not currently working we work out what their METR would be if they were to earn just 1p - usually (but not always) this METR is 0. Some people on benefits may face 'cliff edges' where earning an extra small amount means they lose many £s of benefits - effectively an infinite METR - the results here limit such METRs to 100%. In practice, a person's METR will vary depending on how many hours they work - [here is a simulation exploring complete budget constraints](https://stb.virtual-worlds.scot/bcd/){:target="_blank"}.
    code: http://github.com/grahamstark/

metrs_transitions:
    title: METRs Transitions
    summary: This shows how the METRS of working-age people change as a result of your reforms. The position before your changes is in the rows, and after your changes are in the columns. For instance, the top row shows everyone with a METRs of over 100% before your changes, so they *lose* income as their earnings increase. Likewise the 2nd column gives the numbers with exactly 100% after your changes - so they gain nothing from the next £1 they earn. The red columns below the diagonal are counts of people whose METR has worsened. Likewise movements into the green areas above the diagonal show the numbers whose METR improves as a result of your changes.

poverty:
    title: Measures of Poverty
    summary: The headline poverty rate is the percentage of the Scottish population that live in households with income below 60% of the median. The Child Poverty rate is the percentage of children in such households.
    full: Poverty in this context is about how many people fall below some minimum standard. Since 1991 the official poverty line for the UK has been defined 60% of median equivalised household income. This is the [Households Below Average Income (HBAI) measure](){:target="_blank"}. The model reports headcounts (numbers below the poverty line) and also calculates several other measures; headcounts can be misleading since people below the poverty line all count for the same regardless of whether they are far below the poverty line, or only just below it. The Poverty Gap, Poverty Severity, Shorrocks and Sen measures all give extra weight to extremely poor people.
    note: The changes you make can alter median incomes. That can make poverty changes hard to interpret, so here we always use median income from the base 'no change' system; this is *absolute* rather than *relative* poverty. See [The HBAI Handbook](http://research.dwp.gov.uk/asd/frs/){:target="_blank"} for more on the measure of income. See the [World Bank Handbook on poverty and inequality](http://documents.worldbank.org/curated/en/488081468157174849/Handbook-on-poverty-and-inequality){:target="_blank"} for details of the various poverty measures. Note that all these are *univariate* measures, just of poverty in incomes; *multivariate* measures are also sometimes used - deprivation in food, shelter, and so on. Some measures of that sort might be added to the model in future.

poverty_transitions:
    title: Transitions in and out of Poverty
    summary: This table shows how your changes move people in and out of poverty.
    full: We use the standard poverty measure based on median household income (see above). The position before your changes is in the rows, and after your changes are in the columns. So the top row shows everyone in very deep poverty (less than 30% of median income) before your changes, and the first column is the numbers in severe poverty after your changes. The red columns below the diagonal are counts of people whose poverty state has worsened, for example from mild poverty (3rd row) to deep poverty (2nd row). Likewise movements into the green areas above the diagonal show the numbers who are improving as a result of your changes.

inequality:
    title: Measures of inequality
    summary: This section reports some standard measures of how unequal the distribution of income is. The two most widely reported measures are the Gini (see the Lorenz curve above) and Palma index, which is the share of the richest 10% of the population divided by the share of the poorest 40%.
    full: There is a large literature on measuring inequality - see, for instance, the [World Bank Handbook](https://documents.worldbank.org/en/publication/documents-reports/documentdetail/488081468157174849/Handbook-on-poverty-and-inequality){:target="_blank"}  and [Cowell](https://doi.org/10.1093/acprof:osobl/9780199594030.001.0001){:target="_blank"}. Many possible measures with desirable properties have been proposed. Here, we also report three values for the Atkinson index - the 'ϵ' here is an 'inequality aversion factor' - the higher it is, the more society disapproves of inequality, and the Hoover index, which is It is the percentage of total income that would have to be redistributed to make all incomes equal.

Lorenz:
    title: The Lorenz Curve
    summary:  This is the *Lorenz curve*, a simple but powerful tool we have for thinking systematically about inequality, showing the distribution of income and how your changes affect it. On the x-axis is the cumulative population share - 1/10th, 1/5th and so on, and the cumulative income share is on the y-axis.
    full: If everybody had the same share, the Lorenz curve would be the diagonal line, since the first 10% of the population would have 10% of the income, 50% would have 50% and so on. So the more equal a country is, the closer the Lorenz curve will be to the diagonal, and, conversely, the more unequal it is, the more the curve will be bowed away from the diagonal.  The bigger the area between the diagonal and the the greater the inequality. The Gini Coefficient below just expresses this ratio as a percentage - complete inequality gives a Gini of 100, and complete equality gives 0.

income:
    title: Incomes
    summary: the results here mostly use *before housing costs equivalised income* - the exceptions are the aggregate costings, which use unequivalised money amounts. 'Equivalisation' means adjusting household incomes for family sizes, since a large family costs more to feed and house than a small one. See [the Government Households Below Average Income (HBAI) technical report](https://www.gov.uk/government/statistics/households-below-average-income-for-financial-years-ending-1995-to-2025/households-below-average-income-background-information-and-methodology-report-fye-2025){:target="_blank"} for more more on the income definitions used. The [annual HBAI reports have a very nice chart showing the distribution of HBAI incomes](){:target="_blank"} and we here we reproduce a slightly tweaked version of that chart.
    full:   Income in £per week is on X-axis, in £10 bands, and an estimate of the numbers of people in each band on the y-axis. The chart is a little misleading in that it stops at £1,000pw. In reality, there are people with incomes higher than that - literally off-the-scale - so the full graph stretches far to the right. It's likely that the chart is truncated at £1,000 because very high incomes are hard to measure; I'll return to this point later,
    note: Future versions of the model could allow you to switch between different measures of income, for example before- and after- housing costs, and with different (or no) measures of Equivalisation.

income-tax:
    title: Scottish Income Tax
    summary: Income Tax is mostly devolved to the Scottish Government. The main exceptions are the income tax allowance and taxation of savings and dividends. This panel allows you to change the rates of income tax and the bands over which they apply.
    full: Use the <i class="bi-plus-circle text-success"></i> and <i class="bi-dash-circle text-danger"></i> icons on the right to add and delete tax rates and bands. We include the income tax allowance here even though its value is set by the UK Government. To fully model the income tax system you need many more parameters than this, for example the rates on Dividends and Savings, the withdrawal of the income tax allowance for high earners and Child Benefit withdrawal. These are all in the full ScotBen model but we don't include them here to keep things as straightforward as possible.

national-insurance:
    title: National Insurance
    summary: National Insurance (NI) is a tax on earnings, both for workers and the self-employed. It is set by the UK Government, not the Scottish Government. Payments for NI qualify you for the State Pension and some other state benefits (but not the National Health Service, despite the name).
    full: Different rates National Insurance apply to the self-employed and to waged workers. For workers, NI is charged is charged separately on employees and employers. Here, for simplicity, you can change only the employee rates; the full model covers all forms of NI. Note that there are by default two zero-rate bands of NI; if you earn above the first one, but below band 3, you don't actually pay any NI but are counted as having paid some for qualifying for the state pension and other NI-related state benefits. Use the <i class="bi-plus-circle text-success"></i> and <i class="bi-dash-circle text-danger"></i> icons on the right to add and delete tax rates and bands.

reserved-benefits:
    title: Reserved Benefits
    summary: Most of the spending on benefits in Scotland (roughly £22bn of £28bn) is controlled by the UK government. The most important of these reserved benefits are Universal Credit (UC), paid to working-age families on low incomes, Child Benefit, paid to all families with children except those with very high earnings, and the State Pension. [Many other state benefits exist](https://www.gov.uk/government/publications/benefit-and-pension-rates-2026-to-2027/proposed-benefit-and-pension-rates-2026-to-2027){:target="_blank"}; the full ScotBen can model most of them.
    full: There are two UC parameters here - the Standard Allowances for single people aged over 25, and the taper - the amount someone's UC is reduced as their earnings increase. In reality UC has many different allowances for children, adults of different ages, etc.; in this simulation these are all scaled up or down proportionately. Likewise several different state pensions exist and we scale those to match any change you make to the [New State Pension](https://www.gov.uk/new-state-pension){:target="_blank"}.

scottish-benefits:
    title: Scottish Benefits
    summary: The [Scottish Benefits](https://www.socialsecurity.gov.scot/){:target="_blank"} include most benefits for the disabled - Adult Disability Payment, Child Disability Payment and Pension Age Disability Payment, Discretionary Housing Payments, The Scottish Child Payment (SCP), and a variety of one-off and in-kind payments. The most distinctive of these is SCP, which is a supplement for families with children who are receiving a means-tested benefit (chiefly Universal Credit). SCP is what's modelled here. SCP is a key part of Scotland's [Child Poverty Strategy](https://www.gov.scot/publications/bringing-hope-building-futures-tackling-child-poverty-delivery-plan-2026-2031/){:target="_blank"}.


