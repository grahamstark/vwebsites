metrs:
    title: Incentives To Work - Marginal Effective Tax Rates (METRs)
    summary: The Marginal Effective Tax Rate (METR) is the percentage of the next £1 you earn that is taken away in direct taxes and reduced income-related benefits. A METR of 0 means you keep all of the next £1, while 100% means it's all taken away.
